<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign up - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand">
            <span class="app-nav-title">Expense Tracker</span>
            <h1 id="auth-title">Welcome back</h1>
            <p id="auth-subtitle">Log in to continue managing your expenses.</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Account access">
            <button type="button" class="auth-tab active" id="login-tab" role="tab" aria-selected="true">Login</button>
            <button type="button" class="auth-tab" id="signup-tab" role="tab" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
            <div class="form-group" id="name-group" hidden>
                <label for="auth-name">Name</label>
                <input type="text" id="auth-name" placeholder="Your name" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="auth-email">Email</label>
                <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="auth-password">Password</label>
                <div class="password-field">
                    <input type="password" id="auth-password" placeholder="At least 6 characters" autocomplete="current-password" minlength="6" required>
                    <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button>
                </div>
            </div>

            <div class="form-group" id="confirm-password-group" hidden>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" minlength="6">
            </div>

            <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
            <button type="submit" id="auth-submit">Login</button>
        </form>

    </main>
</body>
</html>
